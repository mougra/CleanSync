<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="TidyPlan">
  <!--
    Иконка приложения: тот же знак на мятном фоне. Используется для favicon,
    apple-touch-icon и PWA-иконок 192/512 (обычных, не maskable).
  -->
  <defs>
    <linearGradient id="tpRingIcon" x1="120" y1="100" x2="420" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3F8A73"/>
      <stop offset="1" stop-color="#2A584D"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#EFF7F4"/>

  <g transform="translate(64 64) scale(6)">
    <circle
      cx="32" cy="32" r="20"
      fill="none"
      stroke="url(#tpRingIcon)"
      stroke-width="6"
      stroke-linecap="round"
      stroke-dasharray="94 32"
      transform="rotate(-90 32 32)"
    />
    <path
      d="M23 33.5 L29.5 40 L42 26"
      fill="none"
      stroke="#2A584D"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M50.5 12.5 l1.9 4.7 4.7 1.9 -4.7 1.9 -1.9 4.7 -1.9 -4.7 -4.7 -1.9 4.7 -1.9z"
      fill="#D8664E"
    />
  </g>
</svg>
