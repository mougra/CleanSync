<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="TidyPlan">
  <!--
    Maskable-иконка для Android: фон залит полностью (система сама вырежет
    круг/квадрат), а знак занимает ~62% — внутри безопасной зоны.
  -->
  <defs>
    <linearGradient id="tpRingMask" x1="140" y1="120" x2="380" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3F8A73"/>
      <stop offset="1" stop-color="#2A584D"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#EFF7F4"/>

  <g transform="translate(96 96) scale(5)">
    <circle
      cx="32" cy="32" r="20"
      fill="none"
      stroke="url(#tpRingMask)"
      stroke-width="6"
      stroke-linecap="round"
      stroke-dasharray="94 32"
      transform="rotate(-90 32 32)"
    />
    <path
      d="M23 33.5 L29.5 40 L42 26"
      fill="none"
      stroke="#2A584D"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M50.5 12.5 l1.9 4.7 4.7 1.9 -4.7 1.9 -1.9 4.7 -1.9 -4.7 -4.7 -1.9 4.7 -1.9z"
      fill="#D8664E"
    />
  </g>
</svg>
