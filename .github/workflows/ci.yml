name: CI

on:
  push:
    branches: [main]
  pull_request:

# Отменяем предыдущий прогон той же ветки: смысла держать оба нет
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Типы, линт, тесты, сборка
    runs-on: ubuntu-latest

    # Тесты API работают с настоящей базой: поднимаем Postgres и накатываем миграции
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clean_planner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: clean_planner_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/clean_planner_test
      ACCESS_TOKEN_SECRET: ci_access_secret_ci_access_secret
      REFRESH_TOKEN_SECRET: ci_refresh_secret_ci_refresh_secret
      NODE_ENV: test
      # Публичный адрес нужен сборке: canonical, карта сайта, письма
      NUXT_PUBLIC_SITE_URL: https://example.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            web/package-lock.json

      # Отдельные lock-файлы в каждом пакете: ставим именно по ним, а не npm install
      - name: Установка зависимостей
        run: |
          npm ci
          npm --prefix backend ci
          npm --prefix web ci

      - name: Схема базы
        run: npm --prefix backend run migrate:up

      - name: Типы
        run: npm run typecheck

      - name: Линт
        run: npm run lint

      - name: Тесты
        run: npm test

      # Инвариант дневного бюджета сгенерированных задач: сумма «ежедневный
      # минимум + недельные + месячные дела» любого дня для обоих генераторов
      # («Мои задачи» и «План по дому») не выше бюджета по ответу анкеты, и ни
      # один день не пустой. Проверка чистая: база и API ей не нужны.
      - name: Бюджет сгенерированных задач
        run: npx --prefix backend tsx backend/scripts/check-default-tasks.ts

      - name: Сборка приложения
        run: npm run build

  docker:
    name: Сборка и публикация Docker-образов
    runs-on: ubuntu-latest

    # Публикация в GHCR — только из main. На PR тот же job собирает образы
    # без push: это проверка, что Dockerfile не сломан.
    permissions:
      contents: read
      packages: write

    env:
      # Публичный адрес запекается в образ web НА СБОРКЕ (canonical, og:url,
      # карта сайта). Переопределяется переменной репозитория SITE_URL:
      # Settings → Secrets and variables → Actions → Variables.
      SITE_URL: ${{ vars.SITE_URL || 'https://tidyplan.ru' }}
      # Владелец репозитория в нижнем регистре: GHCR не принимает заглавные буквы
      IMAGE_OWNER: ${{ github.repository_owner }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Вход в GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Тег :latest — то, что тянет сервер, тег с SHA — для отката на конкретную версию
      - name: backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/cleansync-backend:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/cleansync-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          build-args: |
            NUXT_PUBLIC_SITE_URL=${{ env.SITE_URL }}
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/cleansync-web:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/cleansync-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
