services:
  postgres:
    image: postgres:15-alpine
    container_name: clean_planner_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clean_planner
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/achievements.sql:/docker-entrypoint-initdb.d/02-achievements.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clean_planner_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clean_planner_backend
    env_file:
      - ./backend/.env
    environment:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: clean_planner
      ACCESS_TOKEN_SECRET: your_super_secret_access_key_change_this_in_production
      REFRESH_TOKEN_SECRET: your_super_secret_refresh_key_change_this_in_production
      PORT: 5000
      NODE_ENV: development
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - clean_planner_network
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clean_planner_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - clean_planner_network
    command: npm run dev -- --host

volumes:
  postgres_data:

networks:
  clean_planner_network:
    driver: bridge
